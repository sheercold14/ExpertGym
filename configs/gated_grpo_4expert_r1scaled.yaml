# 4-expert Gated-GRPO with R1 delta scaled to agent-expert range.
# 3 layer bands (early/mid/late) x 4 experts = 15 trainable params (12 eff. DOF).
# Init: T/M/C = 1/3, R = 0.  Target: memory >= 0.55 within 10 iterations.
# Loss: OPD + Retention only (no GRPO policy gradient).

run:
  name: opvec-4expert-r1scaled-3band
  seed: 20260518

storage:
  root: ${ONPOLICY_STORAGE_ROOT}

models:
  base: /mnt/cache/wuruixiao/models/Qwen2.5-7b-instruct
  experts:
    tool: /mnt/cache/wuruixiao/models/Qwen2.5-7B-Instruct-ToolRL-grpo-cold
    memory: /mnt/cache/wuruixiao/models/RL-MemoryAgent-7B
    code: /mnt/cache/wuruixiao/models/ReasonFlux-Coder-7B
    reasoning: /mnt/cache/wuruixiao/models/DeepSeek-R1-Distill-Qwen-7B
  reference_policy: /tmp/shared-storage/AgentMerging_plan/experiments/conflict_gated_residual/ITER_019_cg_tool_extra020/model

modes:
  mode_set: opvec4_r1scaled
  artifact_dir: ${ONPOLICY_STORAGE_ROOT}/modes/opvec4_r1scaled_20260518
  expert_names: [tool, memory, code, reasoning]
  residual_zero_mean: true
  include_regex:
    - "^model\\.layers\\.[0-9]+\\.(self_attn|mlp)\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)\\.weight$"
  exclude_regex:
    - ".*lm_head.*"
    - ".*norm.*"
    - ".*embed_tokens.*"
    - ".*bias.*"
  delta_dtype: float32

layer_bands:
  early: [0, 9]
  mid: [10, 19]
  late: [20, 27]

# T/M/C = 1/3, R = 0  (common + zero-mean residual for 4 experts)
# common = mean(1/3, 1/3, 1/3, 0) = 0.25
# agent_res = 1/3 - 0.25 = 0.0833
# reasoning_res = 0 - 0.25 = -0.25
initial_gates:
  common: 0.25
  tool_residual: 0.0833
  memory_residual: 0.0833
  code_residual: 0.0833
  reasoning_residual: -0.25

gate_bounds:
  common: [0.00, 1.20]
  residual: [-0.50, 0.50]

data:
  seed_manifest: ${ONPOLICY_STORAGE_ROOT}/data/seed_prompt_manifest.jsonl
  behavior_matrix: ${ONPOLICY_STORAGE_ROOT}/data/behavior_matrix.jsonl
  rollout_store: ${ONPOLICY_STORAGE_ROOT}/runs/gated_grpo/onpolicy_rollouts.jsonl

rollout:
  samples_per_prompt: 4
  temperature: 0.7
  top_p: 0.95
  max_new_tokens:
    tool: 512
    memory: 2048
    code: 4096

frontier:
  min_frontier_weight: 0.20
  min_reward_std: 0.05
  drop_all_success_from_policy_loss: true
  drop_all_failure_without_contract_signal: true

loss:
  ppo_loss_weight: 0.0
  opd_loss_weight: 1.0
  eps_clip: 0.2
  beta_kl: 0.02
  lambda_prior: 0.0
  lambda_retention: 0.10
  lambda_invalid: 0.10
  advantage_eps: 1.0e-6

reward:
  behavior_span_weight: 0.00

calibration:
  frontier_task_quota:
    tool: 32
    memory: 32
    code: 32
  task_loss_weight:
    tool: 0.5
    memory: 2.0
    code: 1.5

optimizer:
  name: sgd
  lr: 0.25
  momentum: 0.2
  weight_decay: 0.0
  grad_clip_norm: 1.0

train:
  max_steps: 1
  prompt_batch_size: 96
  retention_batch_size: 32
  eval_interval: 1
  bake_interval: 1

evaluation:
  model_name: opvec-4expert-r1scaled-3band
